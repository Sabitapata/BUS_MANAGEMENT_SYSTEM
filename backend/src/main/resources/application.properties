server.port=8080
spring.application.name=bus-management-system

# By default, use H2 for zero-configuration, instant execution and testing
# To switch to MySQL, simply change active profile to mysql: spring.profiles.active=mysql
spring.profiles.active=dev

# Dev Profile (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:busdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration (Base64 encoded 256-bit secret)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expirationMs=86400000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
